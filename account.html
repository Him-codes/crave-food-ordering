<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="description" content="Manage your Crave demo account and ordering preferences.">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account — Crave</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

</head>


<body>

<header class="header">
    <a href="index.html" class="logo">
        <span>🍔</span> Crave
    </a>

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="deals.html">Deals</a>
        <a href="orders.html">Orders</a>
    </nav>

    <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
        <a href="favorites.html" class="icon-btn" aria-label="Favorites">♡</a>
        <a href="cart.html" class="cart-btn">
            🛒 <span id="cartCount">0</span>
        </a>
    </div>

    <button class="mobile-menu" onclick="toggleMobileNav()" aria-label="Open navigation menu">☰</button>
</header>

<div id="mobileNav" class="mobile-nav">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="deals.html">Deals</a>
    <a href="favorites.html">Favorites</a>
    <a href="orders.html">Orders</a>
    <a href="account.html">Account</a>
</div><section class="page-hero">

    <span class="eyebrow">
        ACCOUNT
    </span>

    <h1>Your account</h1>

    <p>
        Manage your Crave preferences.
    </p>

</section>


<main class="form-page">

    <div class="form-card">

        <h2>Profile</h2>

        <div class="form-grid">

            <div class="form-group">

                <label for="accountName">Name</label>

                <input
                    type="text"
                    id="accountName"
                    autocomplete="name"
                    placeholder="Your name"
                >

            </div>

            <div class="form-group">

                <label for="accountEmail">Email</label>

                <input
                    type="email"
                    id="accountEmail"
                    autocomplete="email"
                    placeholder="you@example.com"
                >

            </div>

        </div>

        <button class="primary-btn account-save" type="button" onclick="saveAccountProfile()">Save profile</button>
        <p id="accountStatus" class="form-note" aria-live="polite"></p>

    </div>


    <div class="form-card">

        <h2>Preferences</h2>

        <div class="feature">

            <span>🌙</span>

            <div>

                <strong>Dark mode</strong>

                <p>
                    Use the moon button in the header.
                </p>

            </div>

        </div>

    </div>


    <div class="form-card">

        <h2>Quick links</h2>

        <p>
            <a href="favorites.html">
                ❤️ Favorites
            </a>
        </p>

        <br>

        <p>
            <a href="orders.html">
                📦 Order history
            </a>
        </p>

    </div>

</main>


<script src="js/products.js"></script>
<script src="js/app.js"></script>

</body>

</html>
